customCommands:
  - key: 'n'
    context: 'worktrees'
    description: 'New worktree (Zed style: ../worktrees/<repo>/<name>)'
    prompts:
      - type: 'input'
        title: 'Worktree name (blank = random name)'
        key: 'Name'
        initialValue: ''
      - type: 'input'
        title: 'Base branch'
        key: 'Base'
        initialValue: '{{.CheckedOutBranch.Name}}'
        suggestions:
          preset: 'refs'
    command: '~/.config/lazygit/worktree-add.sh {{.Form.Name | quote}} {{.Form.Base | quote}}'
    loadingText: 'Adding worktree'
    output: 'log'
  - key: 'D'
    context: 'worktrees'
    description: 'Clean and remove worktree and local branch'
    prompts:
      - type: 'confirm'
        title: 'Permanently tear down worktree?'
        body: 'Clean {{.SelectedWorktree.Path}}, remove it, and force-delete local branch {{.SelectedWorktree.Branch}}?'
    command: '~/.config/lazygit/worktree-remove.sh {{.SelectedWorktree.Path | quote}}'
    loadingText: 'Removing worktree'
    output: 'log'
